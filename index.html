
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkLite - URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LinkLite</h1>
        <p>Short links. Easy sharing.</p>
    </header>

    <main>
        <h2>Make your links shorter</h2>
        <p>Paste your long URL below to get started.</p>

        <input
            type="url"
            id="longUrl"
            placeholder="https://example.com/your-long-link"
        >

        <button id="shortenBtn">Shorten URL</button>

        <div id="result"></div>
    </main>

    <footer>
        <p>Made with ❤️ using HTML, CSS and JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
